# maretan — example server block.
# Point `root` at the project folder; every page is a plain index.html in its own
# directory, so no rewrite rules are needed.
#
#   include /path/to/maretan/nginx.conf;   (inside the http {} block)

server {
    listen 80;
    listen [::]:80;
    server_name www.maretan.com maretan.com;

    root /var/www/maretan;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    # This file and the archived Wix snapshot live next to the site; don't serve them.
    location = /nginx.conf { return 404; }
    location ^~ /old/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprint-free assets: cache for a week, revalidate afterwards.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
}
